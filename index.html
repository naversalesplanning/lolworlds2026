<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<title>2026 LoL 월드챔피언십 생중계 패키지 | NAVER 치지직 광고 상품 소개서</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
/* ============ NANUM SQUARE NEO (fonts-archive CDN) ============ */
@import url('https://cdn.jsdelivr.net/gh/fonts-archive/NanumSquareNeo/NanumSquareNeo.css');
*{font-family:'Nanum Square Neo','Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif !important}

:root{
  /* LoL Esports 시안 팔레트 — 블랙 + 시안 + 화이트/그레이 모노톤 (공식 UI 실측값)
     변수 이름은 기존(crimson/gold)을 유지하고 값만 시안/쿨그레이로 교체 */
  --crimson:#6AE1F6;          /* 시그니처 시안 (구 크림슨) */
  --crimson-bright:#A6F0FA;   /* 밝은 하이라이트 */
  --crimson-deep:#1C8FA3;     /* 그림자 / 딥 그라데이션 중간톤 */
  --crimson-ink:#04181B;      /* 배경에 섞는 아주 어두운 시안-블랙 */
  --cyan-text:#0E6E80;        /* 라이트(크림) 배경 위 텍스트 전용 딥 시안 — 5.4:1 */
  --gold:#9FB3B7;             /* 쿨 그레이 (구 골드 = 세컨더리 라벨) */
  --gold-bright:#D6E4E6;
  --gold-deep:#52686C;
  --ink:#111011;              /* 다크 베이스 (블랙) */
  --ink-2:#1B1A1C;            /* 차콜 */
  --ink-3:#26242A;
  --cream:#F2F5F6;
  --cream-2:#E2E9EA;
  --mute:rgba(242,245,246,.58);
  --mute-strong:rgba(242,245,246,.84);
  --line:rgba(242,245,246,.14);
  --naver-green:#03C75A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--cream);font-feature-settings:"ss01","tnum";-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}

/* ---------- deck shell ---------- */
.deck{display:flex;flex-direction:column;align-items:center;gap:24px;padding:32px 0 96px}
.slide{
  position:relative;width:min(96vw,1600px);aspect-ratio:16/9;
  background:var(--ink);border-radius:14px;overflow:hidden;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05);
  isolation:isolate;
  container-type:inline-size;
  container-name:slide;
}
.slide .topbar{position:absolute;left:0;right:0;top:0;height:.28cqw;background:linear-gradient(90deg,var(--crimson) 0%,var(--crimson-bright) 42%,var(--gold) 100%);z-index:6}

/* ---------- brand mark ---------- */
.brand-mark{position:absolute;left:3.2cqw;top:2.4cqw;z-index:7;display:none;align-items:center;gap:.7cqw}
#s1 .brand-mark,#s13 .brand-mark{display:inline-flex}
.nv-logo{height:1.7cqw;width:auto;display:block}

/* ---------- shared bits ---------- */
.eyebrow{font-size:.92cqw;font-weight:800;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.slide.light .eyebrow{color:var(--gold-deep)}
.foot{position:absolute;left:4cqw;right:4cqw;bottom:1.9cqw;font-size:.72cqw;line-height:1.55;color:rgba(242,245,246,.4);z-index:5}
.slide.light .foot{color:rgba(17,16,17,.42)}
.foot b{font-weight:800;color:rgba(242,245,246,.58)}
.slide.light .foot b{color:rgba(17,16,17,.6)}
.slide.light{background:var(--cream);color:var(--ink)}

/* image placeholder boxes */
.shotbox{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.shotbox .mock-img{display:none;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:.9cqw;box-shadow:0 2cqw 4cqw -1.4cqw rgba(0,0,0,.6);object-fit:contain}
.shotbox.has-img .mock-img{display:block}
.shotbox.has-img .ph-box{display:none}
.ph-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55cqw;width:100%;height:100%;border-radius:.9cqw;border:.14cqw dashed rgba(106,225,246,.55);background:repeating-linear-gradient(45deg,rgba(255,255,255,.035),rgba(255,255,255,.035) 12px,rgba(255,255,255,.07) 12px,rgba(255,255,255,.07) 24px);text-align:center;padding:1.2cqw;color:var(--mute)}
.slide.light .ph-box{border-color:rgba(14,110,128,.45);background:repeating-linear-gradient(45deg,#E9EEEF,#E9EEEF 12px,#DCE4E5 12px,#DCE4E5 24px);color:rgba(17,16,17,.55)}
.ph-box .ph-tag{font-size:.72cqw;font-weight:800;letter-spacing:.18em;color:var(--crimson);padding:.28cqw .8cqw;border-radius:99px;border:1px solid rgba(106,225,246,.45);background:rgba(106,225,246,.1)}
.slide.light .ph-box .ph-tag{background:#fff;color:var(--cyan-text);border-color:rgba(14,110,128,.4)}
.ph-box .ph-path{font-size:.8cqw;line-height:1.5;font-family:'SF Mono',ui-monospace,monospace !important;font-weight:700;word-break:break-all;color:inherit;opacity:.95}
.ph-box .ph-hint{font-size:.72cqw;line-height:1.55;opacity:.65}

/* ============================================================
   S1 — COVER
   ============================================================ */
.s1{background:
  radial-gradient(62% 78% at 22% 44%,rgba(106,225,246,.34) 0%,transparent 62%),
  radial-gradient(50% 60% at 92% 8%,rgba(106,225,246,.13) 0%,transparent 60%),
  linear-gradient(160deg,#0C1719 0%,#111011 52%,#050708 100%);
  display:grid;grid-template-columns:38% 1fr;align-items:center;padding:0 5.5cqw}
.s1::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px);pointer-events:none;z-index:1}
.s1 .emblem-side{position:relative;z-index:2;aspect-ratio:1/1;width:88%;justify-self:center;display:flex;align-items:center;justify-content:center}
.s1 .emblem-side .shotbox{width:100%;height:100%}
.s1 .emblem-side .mock-img{filter:drop-shadow(0 2cqw 4cqw rgba(106,225,246,.5));box-shadow:none;border-radius:0}
.s1 .cv{position:relative;z-index:2}
.s1 .cv .eyebrow{margin-bottom:1.5cqw}
.s1 h1{font-size:4.5cqw;font-weight:900;line-height:1.14;letter-spacing:-.028em}
.s1 h1 em{font-style:normal;color:var(--crimson-bright)}
.s1 .rule{width:8cqw;height:.28cqw;background:linear-gradient(90deg,var(--crimson),var(--gold));margin:2cqw 0 1.8cqw;border-radius:99px}
.s1 .sub{font-size:1.85cqw;font-weight:700;color:var(--mute-strong);letter-spacing:-.01em}
.s1 .meta{margin-top:2.6cqw;display:flex;gap:2.2cqw;flex-wrap:wrap}
.s1 .meta div{display:flex;align-items:center;gap:.8cqw;padding-right:2.2cqw;border-right:1px solid var(--line)}
.s1 .meta div:last-child{border-right:none;padding-right:0}
.s1 .meta .ic{flex:0 0 auto;width:2.2cqw;height:2.2cqw;border-radius:.55cqw;background:rgba(106,225,246,.14);color:var(--crimson-bright);display:flex;align-items:center;justify-content:center}
.s1 .meta .ic svg{width:1.15cqw;height:1.15cqw}
.s1 .meta .tx{font-size:.92cqw;line-height:1.6;color:var(--mute)}
.s1 .meta div b{display:block;font-size:1.18cqw;font-weight:800;color:#fff;letter-spacing:-.01em}

/* ============================================================
   S2 — 대회 개요
   ============================================================ */
.s2{background:linear-gradient(165deg,#0A1416 0%,#111011 60%,#070B0C 100%);padding:3.6cqw 4.4cqw 4.4cqw;display:flex;flex-direction:column}
.s2 h2,.s3 h2,.s4 h2,.s5 h2,.s6 h2,.s8 h2,.s9 h2,.s10 h2,.s11 h2,.s12 h2{font-size:2.55cqw;font-weight:900;letter-spacing:-.024em;line-height:1.2}
.s2 h2 em,.s3 h2 em,.s4 h2 em,.s5 h2 em,.s6 h2 em,.s8 h2 em,.s9 h2 em,.s10 h2 em,.s11 h2 em,.s12 h2 em{font-style:normal;color:var(--crimson-bright)}
.s2 .lead{margin-top:.7cqw;font-size:1.06cqw;color:var(--mute)}
.s2 .body{flex:1;min-height:0;display:grid;grid-template-columns:31% 1fr;grid-template-rows:1fr auto;gap:1.5cqw 2.2cqw;margin-top:2cqw}
.s2 .facts{display:flex;flex-direction:column;gap:.7cqw}
.s2 .fact{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--line);border-left:.24cqw solid var(--crimson);border-radius:.7cqw;padding:.95cqw 1.15cqw;flex:1;display:flex;align-items:center;gap:.9cqw}
.s2 .fact .ic{flex:0 0 auto;width:2.5cqw;height:2.5cqw;border-radius:.6cqw;display:flex;align-items:center;justify-content:center;background:rgba(106,225,246,.13);color:var(--crimson-bright)}
.s2 .fact .ic svg{width:1.3cqw;height:1.3cqw}
.s2 .fact .tx{display:flex;flex-direction:column;gap:.22cqw;min-width:0}
.s2 .fact .k{font-size:.76cqw;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.s2 .fact .v{font-size:1.24cqw;font-weight:800;color:#fff;line-height:1.35;letter-spacing:-.01em}
.s2 .fact .v small{display:block;font-size:.8cqw;font-weight:600;color:var(--mute);margin-top:.2cqw;letter-spacing:0}
.s2 .fact.tbd{border-left-color:var(--gold-deep)}
.s2 .fact.tbd .ic{background:rgba(159,179,183,.16);color:var(--gold-bright)}
.s2 .fact.tbd .v{color:var(--gold-bright)}
.s2 .stages{display:flex;flex-direction:column;gap:.7cqw;min-height:0;position:relative}
.s2 .stages::before{content:"";position:absolute;left:2.69cqw;top:4.23cqw;bottom:4.23cqw;width:2px;background:linear-gradient(180deg,var(--crimson) 0%,var(--crimson) 78%,#FFD873 100%);opacity:.55;z-index:0}
.s2 .stage{position:relative;z-index:1;display:grid;grid-template-columns:3.2cqw 1fr;gap:1.1cqw;align-items:center;background:linear-gradient(100deg,rgba(106,225,246,.14),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:.7cqw;padding:.9cqw 1.3cqw;flex:1}
.s2 .stage .no{width:3.2cqw;height:3.2cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15cqw;font-weight:900;background:linear-gradient(140deg,var(--crimson),var(--crimson-deep));color:#04181B;box-shadow:0 .5cqw 1.2cqw -.4cqw rgba(106,225,246,.9)}
.s2 .stage.fin{background:linear-gradient(100deg,rgba(255,216,115,.16),rgba(255,255,255,.03));border-color:rgba(255,216,115,.45)}
.s2 .stage.fin .no{background:linear-gradient(140deg,#FFD873,#E8A93D);color:#3B2600;box-shadow:0 .5cqw 1.2cqw -.4cqw rgba(255,216,115,.85)}
.s2 .stage .nm{font-size:1.34cqw;font-weight:900;color:#fff;letter-spacing:-.012em}
.s2 .stage .nm span{color:var(--crimson-bright);margin-left:.5cqw;font-size:1.18cqw}
.s2 .stage.fin .nm span{color:#FFD873}
.s2 .stage .vn{font-size:.92cqw;color:var(--mute);margin-top:.2cqw;line-height:1.45}
.s2 .firstna{grid-column:1/-1;display:flex;align-items:center;gap:.7cqw;padding:.8cqw 1.3cqw;border-radius:.7cqw;background:linear-gradient(100deg,rgba(106,225,246,.16),rgba(106,225,246,.03));border:1px solid rgba(106,225,246,.4);font-size:1.02cqw;font-weight:800;color:var(--crimson-bright)}
.s2 .firstna svg{flex:0 0 auto;width:1.3cqw;height:1.3cqw}

/* ============================================================
   S3 — WHY 치지직
   ============================================================ */
.s3{background:linear-gradient(170deg,#081113 0%,#111011 55%,#060A0B 100%);padding:3.4cqw 4.4cqw 4.4cqw;display:flex;flex-direction:column}
.s3 .hd{text-align:center}
.s3 .lead{margin-top:.7cqw;font-size:1.1cqw;color:var(--mute)}
.s3 .big3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3cqw;margin-top:1.6cqw;flex:1.25;min-height:0}
.s3 .bc{background:linear-gradient(180deg,rgba(106,225,246,.2),rgba(255,255,255,.02));border:1px solid rgba(106,225,246,.36);border-radius:1cqw;padding:1.5cqw;display:flex;flex-direction:column;justify-content:center;gap:.55cqw;position:relative;overflow:hidden}
.s3 .bc .lab{font-size:1.14cqw;font-weight:800;letter-spacing:.06em;color:var(--gold-bright);position:relative}
.s3 .bc .pct{font-size:4.9cqw;font-weight:900;line-height:1;letter-spacing:-.03em;color:#fff;position:relative}
.s3 .bc .pct i{font-style:normal;font-size:2cqw;color:var(--crimson-bright);margin-left:.15cqw}
.s3 .bc .cmp{margin-top:.5cqw;font-size:1.16cqw;color:var(--mute);line-height:1.5;position:relative;font-variant-numeric:tabular-nums}
.s3 .bc .cmp b{color:var(--mute-strong);font-weight:700}
.s3 .bc .cmp .ar{color:var(--crimson-bright);font-weight:900;margin:0 .3cqw}
.s3 .sub3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3cqw;margin-top:1.3cqw;flex:1;min-height:0}
.s3 .sc{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:1cqw;padding:1.25cqw 1.4cqw;display:flex;align-items:center;justify-content:space-between;gap:1cqw}
.s3 .sc .l .t{font-size:1.28cqw;font-weight:800;color:#fff;line-height:1.35}
.s3 .sc .l .t span{display:block;font-size:.94cqw;font-weight:700;color:var(--gold);letter-spacing:.1em;margin-bottom:.25cqw}
.s3 .sc .l .b{margin-top:.5cqw;font-size:.92cqw;color:var(--mute);line-height:1.45}
.s3 .sc .r{font-size:3.8cqw;font-weight:900;color:var(--crimson-bright);letter-spacing:-.03em;white-space:nowrap}
.s3 .sc .r i{font-style:normal;font-size:1.9cqw;font-weight:900;color:var(--crimson-bright);margin-left:.15cqw}

/* ============================================================
   S4 — 광고 노출 시청자
   ============================================================ */
.s4{background:linear-gradient(150deg,#0A1416 0%,#111011 58%,#060A0B 100%);padding:3.6cqw 4.4cqw 4.6cqw;display:flex;flex-direction:column}
.s4 .hd{text-align:center}
.s4 .lead{margin-top:.9cqw;font-size:1.3cqw;color:var(--mute-strong);line-height:1.6}
.s4 .lead u{text-decoration:none;color:var(--crimson-bright);font-weight:900}
.s4 .body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:3cqw;align-items:stretch;margin-top:2.4cqw;position:relative}
.s4 .body::before{content:"";position:absolute;left:50%;top:4%;bottom:4%;width:1px;background:linear-gradient(180deg,transparent,var(--line) 18%,var(--line) 82%,transparent)}
.s4 .cap{margin-top:1.3cqw;font-size:.92cqw;font-weight:800;letter-spacing:.1em;color:var(--gold)}
.s4 .lv{display:flex;flex-direction:column;align-items:center;height:100%}
.s4 .lvbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.7cqw}
.s4 .lvchips{display:flex;align-items:center;gap:1.1cqw}
.s4 .chip{padding:1.35cqw 3.3cqw;border-radius:.8cqw;font-size:2.6cqw;font-weight:900;letter-spacing:.06em}
.s4 .chip.live{background:linear-gradient(135deg,var(--crimson),var(--crimson-deep));color:#04181B;box-shadow:0 1cqw 2.2cqw -.8cqw rgba(106,225,246,.9)}
.s4 .chip.vod{background:transparent;border:.16cqw solid var(--gold);color:var(--gold-bright)}
.s4 .plus{width:2.9cqw;height:2.9cqw;border-radius:50%;background:var(--naver-green);color:#0A2A16;display:flex;align-items:center;justify-content:center;font-size:1.8cqw;font-weight:900}
.s4 .lvtxt{text-align:center;font-size:1.42cqw;line-height:1.75;color:var(--mute-strong)}
.s4 .lvtxt b{color:#fff;font-weight:800}
.s4 .rv{display:flex;flex-direction:column;align-items:center;height:100%}
.s4 .rvrow{flex:1;display:flex;align-items:center;justify-content:center;gap:2.2cqw}
.s4 .donut{position:relative;width:25.5cqw;height:25.5cqw;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--crimson) 0 69%,#2E93A8 69% 85%,var(--gold) 85% 100%);
  box-shadow:0 1.8cqw 3.6cqw -1.2cqw rgba(0,0,0,.7)}
.s4 .donut::after{content:"";position:absolute;inset:27%;border-radius:50%;background:#0D1315}
.s4 .donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.s4 .donut .ctr .n{font-size:3cqw;font-weight:900;color:#fff;line-height:1;letter-spacing:-.03em}
.s4 .donut .ctr .l{margin-top:.3cqw;font-size:.82cqw;font-weight:800;letter-spacing:.14em;color:var(--gold)}
.s4 .lg{display:flex;flex-direction:column;gap:1.1cqw}
.s4 .lg .li{display:flex;align-items:flex-start;gap:.75cqw}
.s4 .lg .li .dot{width:.9cqw;height:.9cqw;border-radius:.24cqw;margin-top:.25cqw;flex:0 0 auto}
.s4 .lg .li .dot.a{background:var(--crimson)}
.s4 .lg .li .dot.b{background:#2E93A8}
.s4 .lg .li .dot.c{background:var(--gold)}
.s4 .lg .li .tx{font-size:1cqw;color:var(--mute-strong);line-height:1.4}
.s4 .lg .li .tx b{display:block;font-size:1.32cqw;font-weight:900;color:#fff;letter-spacing:-.01em}

/* ============================================================
   S5 / S6 — 지면 소개 (스크린샷)
   ============================================================ */
.s5,.s6{background:linear-gradient(165deg,#091315 0%,#111011 58%,#050708 100%);padding:3.2cqw 4.4cqw 4.2cqw;display:flex;flex-direction:column}
.s5 .hd,.s6 .hd{text-align:center;flex:0 0 auto}
.s5 .lead,.s6 .lead{margin-top:.8cqw;font-size:1.42cqw;font-weight:700;color:var(--mute-strong);line-height:1.55}
.s5 .lead em,.s6 .lead em{font-style:normal;color:var(--crimson-bright);font-weight:900;border-bottom:.14cqw solid var(--crimson);padding-bottom:.1cqw}
.s5 .stage,.s6 .stage{flex:1;min-height:0;margin-top:1.4cqw;display:flex;align-items:center;justify-content:center;position:relative}
.s5 .stage .shotbox,.s6 .stage .shotbox{width:74%;height:100%}
.s6 .defs{margin-top:.9cqw;display:flex;flex-direction:column;gap:.3cqw;flex:0 0 auto}
.s6 .defs div{font-size:.86cqw;color:rgba(242,245,246,.62);line-height:1.5}
.s6 .defs div b{color:var(--gold-bright);font-weight:800}

/* ============================================================
   S7 — DIVIDER
   ============================================================ */
.s7{background:
  radial-gradient(65% 80% at 50% 52%,rgba(106,225,246,.4) 0%,transparent 64%),
  linear-gradient(150deg,#0D1A1D 0%,#111011 55%,#040607 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5cqw;text-align:center}
.s7::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.02) 0 2px,transparent 2px 11px);z-index:1}
.s7 .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34cqw;height:auto;opacity:.07;z-index:1;filter:brightness(0) invert(1);pointer-events:none;user-select:none}
.s7 .ch{position:relative;z-index:2;font-size:.98cqw;font-weight:800;letter-spacing:.42em;color:var(--gold);text-transform:uppercase}
.s7 h1{position:relative;z-index:2;font-size:5.4cqw;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.s7 h1 em{font-style:normal;color:var(--crimson-bright)}
.s7 .rule{position:relative;z-index:2;width:12cqw;height:.26cqw;background:linear-gradient(90deg,transparent,var(--crimson),var(--gold),transparent);border-radius:99px}
.s7 .dsub{position:relative;z-index:2;font-size:1.24cqw;color:var(--mute);line-height:1.7}

/* ============================================================
   S8 / S9 — 상품 구성
   ============================================================ */
.s8,.s9{background:var(--cream);color:var(--ink);padding:2.9cqw 4cqw 4cqw;display:flex;flex-direction:column}
.s8 .tag,.s9 .tag{align-self:flex-start;padding:.5cqw 1.5cqw;border-radius:.5cqw;background:var(--crimson);color:#04181B;font-size:.94cqw;font-weight:900;letter-spacing:.06em}
.s8 h2,.s9 h2{margin-top:.9cqw;color:var(--ink)}
.s8 h2 em,.s9 h2 em{color:var(--cyan-text)}
.s8 .lead,.s9 .lead{margin-top:.65cqw;font-size:1.12cqw;font-weight:700;color:rgba(17,16,17,.68);line-height:1.55}
.s8 .mocks,.s9 .mocks{display:grid;grid-template-columns:1fr .42fr 1fr;gap:1.4cqw;align-items:center;margin-top:1.1cqw;flex:1;min-height:0}
.s8 .mk,.s9 .mk{height:100%;display:flex;flex-direction:column;gap:.5cqw;min-height:0}
.s8 .mk .cap,.s9 .mk .cap{font-size:.88cqw;font-weight:800;color:rgba(17,16,17,.55);text-align:center;flex:0 0 auto}
.s8 .mk .shotbox,.s9 .mk .shotbox{flex:1;min-height:0}
.s8 .mid,.s9 .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9cqw;text-align:center}
.s8 .mid .arrow,.s9 .mid .arrow{font-size:2cqw;color:var(--cyan-text);line-height:1}
.s8 .mid .tx,.s9 .mid .tx{font-size:.9cqw;font-weight:700;color:rgba(17,16,17,.6);line-height:1.5}
.s8 .tl,.s9 .tl{margin-top:1cqw;position:relative;height:4cqw;flex:0 0 auto}
.s8 .tl .bar,.s9 .tl .bar{position:absolute;left:0;right:0;top:1.9cqw;height:.28cqw;background:rgba(17,16,17,.16);border-radius:99px}
.s8 .tl .seg,.s9 .tl .seg{position:absolute;top:1.68cqw;height:.72cqw;background:var(--cyan-text);border-radius:99px}
.s8 .tl .seg::before,.s9 .tl .seg::before{content:"";position:absolute;left:0;top:50%;transform:translate(-50%,-50%);width:1.3cqw;height:1.3cqw;border-radius:50%;background:var(--cyan-text);border:.2cqw solid #fff;box-shadow:0 0 0 .16cqw rgba(14,110,128,.22)}
/* 액션 라벨은 바 위, 시점(회색) 라벨은 바 아래 → 목업 하단과 겹치지 않음 */
.s8 .tl .lb,.s9 .tl .lb{position:absolute;top:.35cqw;transform:translateX(-50%);font-size:.8cqw;font-weight:800;color:var(--cyan-text);white-space:nowrap}
.s8 .tl .lb.gray,.s9 .tl .lb.gray{top:2.85cqw;color:rgba(17,16,17,.58)}

.s8 .feats li,.s9 .feats li{list-style:none;display:flex;gap:.55cqw;align-items:flex-start;font-size:.9cqw;line-height:1.45;color:rgba(17,16,17,.78)}
.s8 .feats li::before,.s9 .feats li::before{content:"•";color:rgba(17,16,17,.4);font-weight:900;flex:0 0 auto}
.s8 .feats li.hi,.s9 .feats li.hi{color:var(--cyan-text);font-weight:800}
.s8 .feats li.hi::before,.s9 .feats li.hi::before{color:var(--cyan-text)}

/* ============================================================
   S10 / S11 — 단가표
   ============================================================ */
.s10,.s11{background:var(--cream);color:var(--ink);padding:3cqw 4.6cqw 5.4cqw;display:flex;flex-direction:column}
.s10 .hd,.s11 .hd{text-align:center;flex:0 0 auto}
.s10 h2,.s11 h2{color:var(--ink)}
.s10 h2 em,.s11 h2 em{color:var(--cyan-text)}
.s10 .lead,.s11 .lead{margin-top:.7cqw;font-size:1.14cqw;font-weight:700;color:rgba(17,16,17,.66);line-height:1.55}
.s11 .tag{display:inline-block;padding:.45cqw 1.4cqw;border-radius:.5cqw;background:var(--crimson);color:#04181B;font-size:.9cqw;font-weight:900;letter-spacing:.08em;margin-bottom:.8cqw}
.s11 .kicker{font-size:1.06cqw;font-weight:800;color:var(--gold-deep);letter-spacing:.02em;margin-bottom:.35cqw}
.s11 .bullets{margin-top:1.2cqw;display:flex;flex-direction:column;gap:.42cqw;flex:0 0 auto;align-self:center;width:fit-content}
.s11 .bullets li{list-style:none;display:flex;gap:.6cqw;align-items:flex-start;font-size:1.06cqw;font-weight:700;line-height:1.5;color:rgba(17,16,17,.82)}
.s11 .bullets li::before{content:"•";color:var(--cyan-text);font-weight:900}
.s11 .bullets li em{font-style:normal;color:var(--cyan-text);font-weight:900}
.tblwrap{margin-top:1.4cqw;flex:1;min-height:0;display:flex;align-items:stretch}
.tbl{width:100%;height:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;background:#fff;border-radius:.7cqw;overflow:hidden;box-shadow:0 1.2cqw 2.6cqw -1.2cqw rgba(17,16,17,.28)}
.tbl th{background:var(--crimson-ink);color:#fff;font-size:1cqw;font-weight:800;padding:.95cqw .7cqw;text-align:center;line-height:1.35;letter-spacing:-.005em}
.tbl td{padding:1.05cqw .8cqw;text-align:center;font-size:1.02cqw;line-height:1.45;color:rgba(17,16,17,.86);border-bottom:1px solid rgba(17,16,17,.09);border-right:1px solid rgba(17,16,17,.07);font-weight:700}
.tbl td:last-child{border-right:none}
.tbl tr:last-child td{border-bottom:none}
.tbl td.imp{background:rgba(14,110,128,.06)}
.tbl td .lb{display:block;font-size:.8cqw;font-weight:700;color:rgba(17,16,17,.5);margin-bottom:.15cqw}
.tbl td .bg{display:block;font-size:1.75cqw;font-weight:900;color:var(--crimson-ink);letter-spacing:-.02em}
.tbl td.price .bg{color:var(--cyan-text)}
.tbl tr.promo td{background:rgba(14,110,128,.08);border-bottom:none;box-shadow:inset 0 1px 0 rgba(14,110,128,.3),inset 0 -1px 0 rgba(14,110,128,.3)}
.tbl tr.promo td.ttl{position:relative;font-size:1.6cqw;font-weight:900;color:var(--cyan-text);letter-spacing:-.02em}
.tbl tr.promo td.ttl::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:.3cqw;background:var(--cyan-text);border-radius:0 .25cqw .25cqw 0}
.tbl tr.promo td.ttl svg{flex:0 0 auto;width:1.3cqw;height:1.3cqw;vertical-align:-.25cqw;margin-right:.5cqw}
.tbl td .was{display:block;font-size:1.15cqw;font-weight:800;color:rgba(17,16,17,.52);text-decoration:line-through;margin-bottom:.15cqw}
.tbl td .now{display:block;font-size:2cqw;font-weight:900;color:var(--cyan-text);letter-spacing:-.025em}
.tbl td .save{display:inline-block;vertical-align:middle;margin-left:.5cqw;font-size:.68cqw;font-weight:800;color:#fff;background:var(--cyan-text);padding:.22cqw .62cqw;border-radius:99px;letter-spacing:.02em}

/* ============================================================
   S12 — 유의사항
   ============================================================ */
.s12{background:var(--cream);color:var(--ink);padding:3cqw 4.4cqw 3.6cqw;display:flex;flex-direction:column}
.s12 h2{color:var(--ink)}
.s12 h2 em{color:var(--cyan-text)}
.s12 .lead{margin-top:.5cqw;font-size:.92cqw;color:rgba(17,16,17,.55)}
.s12 .notes{display:grid;grid-template-columns:1fr 1fr;gap:.7cqw 1.5cqw;margin-top:1.2cqw;align-content:start}
.s12 .notes li{list-style:none;display:flex;gap:.8cqw;align-items:flex-start;padding:.95cqw 1.1cqw;background:#fff;border-radius:.55cqw;border:1px solid rgba(17,16,17,.07);font-size:1cqw;line-height:1.5;color:rgba(17,16,17,.8)}
.s12 .notes li .n{flex:0 0 1.85cqw;height:1.85cqw;border-radius:.38cqw;background:var(--crimson);color:#04181B;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:.86cqw}
.s12 .notes li b{color:var(--ink);font-weight:900}
.s12 .notes li .red{color:var(--cyan-text);font-weight:900}
.s12 .notes li .mail{color:var(--cyan-text);font-weight:800;text-decoration:underline;text-underline-offset:2px}

/* ============================================================
   S13 — E.O.D.
   ============================================================ */
.s13{background:linear-gradient(170deg,#0E2A31 0%,#082026 55%,#04181B 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5.5cqw 5cqw;text-align:center;overflow:hidden}
.s13::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 40%,rgba(106,225,246,.16),transparent 62%);z-index:0}
.s13 .brand-mark{position:static;flex-direction:column;gap:.3cqw;z-index:2}
.s13 .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;z-index:2}
.s13 .eod{font-size:6cqw;font-weight:900;letter-spacing:.1em;line-height:1;color:var(--crimson)}
.s13 .thx{font-size:1.9cqw;font-weight:800;letter-spacing:-.01em;color:rgba(255,255,255,.92)}
.s13 .rule{width:9cqw;height:.22cqw;background:var(--crimson);border-radius:99px}
.s13 .contact{font-size:1.02cqw;line-height:1.75;color:rgba(255,255,255,.9);font-weight:600;z-index:2}
.s13 .contact .em{display:block;margin-top:.35cqw;font-size:1.3cqw;font-weight:900;letter-spacing:.01em;color:var(--crimson-bright)}

/* ============================================================
   NAV HUD + TOOLBAR
   ============================================================ */
.hud{position:fixed;right:calc((100vw - min(96vw,1600px))/4 - 4px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:20}
.hud a{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);transition:.2s}
.hud a:hover{background:var(--crimson-bright);transform:scale(1.4)}
.hud a.on{background:var(--crimson-bright)}
.toolbar{position:fixed;left:18px;bottom:18px;display:flex;gap:8px;z-index:20}
.toolbar button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(0,0,0,.65);border:1px solid rgba(106,225,246,.45);color:#B8E9F2;font-size:12px;font-weight:800;letter-spacing:.05em;border-radius:99px;cursor:pointer;backdrop-filter:blur(10px)}
.toolbar button .ico{flex:0 0 auto;display:block}
.toolbar button:hover{background:rgba(106,225,246,.2);color:#fff}
.toolbar button:disabled{opacity:.55;cursor:default}
#pdfBtn:disabled{opacity:1;cursor:progress}
/* secret edit controls: hidden unless unlocked via ?edit=lol-edit */
#editBtn,#resetBtn,#annotBtn,#exportBtn{display:none}
body.edit-enabled #editBtn,body.edit-enabled #annotBtn,body.edit-enabled #exportBtn{display:inline-block}
body.edit-enabled.editing #resetBtn{display:inline-block}
#exportBtn.busy{opacity:.6;pointer-events:none}
body.presenting #editBtn,body.presenting #resetBtn,body.presenting #annotBtn{display:none !important}
#editBtn.on{background:linear-gradient(135deg,var(--crimson),var(--crimson-deep));color:#04181B;border-color:var(--crimson)}
#annotBtn.on{background:var(--gold);color:#0B1517;border-color:var(--gold)}

/* ---------- EDIT MODE ---------- */
.edit-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:9997;background:linear-gradient(90deg,var(--crimson),var(--gold));color:#04181B;font-size:13px;font-weight:800;padding:9px 16px;align-items:center;justify-content:center;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.edit-banner .hint{font-weight:600;opacity:.88;font-size:12px}
body.editing .edit-banner{display:flex}
body.presenting .edit-banner{display:none !important}
body.editing [contenteditable]{cursor:text;border-radius:3px;transition:background .12s,outline .12s}
body.editing [contenteditable]:hover{outline:1px dashed rgba(106,225,246,.8);outline-offset:2px;background:rgba(106,225,246,.08)}
body.editing [contenteditable]:focus{outline:2px solid var(--crimson);outline-offset:2px;background:rgba(106,225,246,.14)}
body.editing .img-editable{cursor:pointer;position:relative}
body.editing .img-editable:hover{outline:2px dashed var(--crimson);outline-offset:2px;border-radius:6px}
body.editing .img-editable:hover::after{content:'클릭해서 이미지 교체';position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#B8E9F2;font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;z-index:50;white-space:nowrap;pointer-events:none}

/* ---------- 📌 ANNOTATION MODE ---------- */
body.annotating .deck .slide *:hover{outline:2px dashed var(--crimson);outline-offset:2px;cursor:crosshair}
.annot-pin{position:absolute;z-index:60;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--crimson);color:#04181B;font-size:13px;font-weight:800;line-height:24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none}
body:not(.annotating) .annot-pin{display:none}
.annot-panel{position:fixed;right:14px;bottom:64px;z-index:1000;background:rgba(10,18,20,.97);color:var(--cream);border:1px solid rgba(106,225,246,.5);border-radius:12px;padding:12px 14px;font-size:12px;max-width:360px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
body:not(.annotating) .annot-panel{display:none}
.annot-panel .ap-list{max-height:180px;overflow:auto;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.annot-panel .ap-list .ap-item{padding:5px 8px;background:rgba(255,255,255,.07);border-radius:6px;line-height:1.35}
.annot-panel .ap-btns{display:flex;gap:6px;margin-top:6px}
.annot-panel .ap-btns button{flex:1;padding:7px 0;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--cream);font-weight:800;font-size:12px;cursor:pointer}
.annot-panel .ap-btns .ap-copy{background:var(--crimson);color:#04181B;border-color:var(--crimson)}

/* ============ PRINT (16:9 full-bleed landscape) ============ */
@page{size:297mm 167.0625mm;margin:0}
@media print{
  html,body{background:#fff;margin:0;padding:0;width:297mm;height:167.0625mm;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  body{overflow:visible !important}
  .deck{gap:0;padding:0;margin:0;display:block;width:297mm}
  .hud,.toolbar,.edit-banner,.annot-panel,.annot-pin{display:none !important}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  .slide{
    width:297mm !important;height:167.0625mm !important;
    max-width:none !important;max-height:none !important;aspect-ratio:auto !important;
    page-break-after:always;page-break-inside:avoid;break-inside:avoid;
    border-radius:0 !important;box-shadow:none !important;margin:0 !important;
    transform:none !important;inset:auto !important;position:relative !important;
    overflow:hidden !important;container-type:inline-size !important;
  }
  .slide:last-child{page-break-after:auto}
  [contenteditable]{outline:none !important;background:none !important}
  body.presenting{overflow:visible !important}
  body.presenting .deck{position:static !important;display:block !important;inset:auto !important;width:297mm !important;height:auto !important}
  body.presenting .slide,body.presenting .slide.active{display:block !important;position:relative !important;inset:auto !important;transform:none !important;width:297mm !important;height:167.0625mm !important;aspect-ratio:auto !important}
}

/* ============ PRESENTATION MODE — 16:9 strict + flex-centered + scale ============ */
body.presenting{overflow:hidden;background:#000}
html:has(body.presenting){background:#000}
body.presenting .deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0;gap:0;margin:0;width:100vw;height:100vh}
body.presenting .slide:not(.active){display:none}
body.presenting .slide.active{
  position:relative;left:auto;top:auto;
  width:1600px;height:900px;aspect-ratio:auto;flex:0 0 auto;
  border-radius:0;box-shadow:none;margin:0;
  /* length/length in calc() → unitless ratio. scale(min(100vw/1600, …)) without calc
     is invalid (it resolves to a length) and silently no-ops, breaking the fit. */
  transform:scale(calc(min(100vw / 1600px, 100vh / 900px)));
  transform-origin:center center;
  animation:p-fade .35s cubic-bezier(.2,.7,.2,1)
}
body.presenting .hud{display:none}
body.presenting .toolbar{position:fixed;bottom:14px;right:14px;left:auto;z-index:9999;opacity:.2;transition:opacity .3s}
body.presenting .toolbar:hover{opacity:1}
body.presenting .toolbar button{background:rgba(0,0,0,.75);font-size:11px;padding:6px 10px}
@keyframes p-fade{from{opacity:0}to{opacity:1}}
.present-counter{position:fixed;bottom:18px;left:18px;z-index:9998;color:rgba(255,255,255,.55);font-size:12px;font-weight:800;letter-spacing:.16em;display:none;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:99px;backdrop-filter:blur(10px)}
body.presenting .present-counter{display:block}

/* ============================================================
   PASSWORD GATE
   ============================================================ */
.gate{position:fixed;inset:0;z-index:99999;background:radial-gradient(60% 60% at 50% 40%,rgba(106,225,246,.18),transparent 62%),linear-gradient(170deg,#0E2A31 0%,#082026 55%,#04181B 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Nanum Square Neo','Pretendard Variable',Pretendard,system-ui,sans-serif}
.gate.hidden{display:none}
#lockBtn{display:none}
.gate-box{width:min(92vw,440px);padding:44px 40px;background:rgba(255,255,255,.045);border:1px solid rgba(106,225,246,.28);border-radius:16px;backdrop-filter:blur(20px);text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.65)}
.gate-naver{margin:0 auto 26px;display:flex;justify-content:center}
.gate-naver img{width:120px;height:auto;display:block;max-height:28px;object-fit:contain}
.gate-box h1{font-size:22px;font-weight:900;letter-spacing:-.01em;line-height:1.3;margin-bottom:10px}
.gate-box h1 em{font-style:normal;color:var(--crimson-bright)}
.gate-box .sub{font-size:13px;color:rgba(255,255,255,.55);letter-spacing:.02em;margin-bottom:30px;line-height:1.6}
.gate-form{display:flex;gap:8px;flex-direction:column}
.gate-form input{padding:14px 18px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);border-radius:10px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:.2s;letter-spacing:.02em}
.gate-form input:focus{border-color:var(--crimson);background:rgba(0,0,0,.55)}
.gate-form button{padding:14px;background:linear-gradient(135deg,var(--crimson),var(--crimson-deep));color:#04181B;font-size:14px;font-weight:900;letter-spacing:.04em;border:none;border-radius:10px;cursor:pointer;transition:.2s}
.gate-form button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(106,225,246,.3)}
.gate-err{margin-top:14px;font-size:12px;color:#ff7373;min-height:16px;letter-spacing:.02em}
.gate-foot{margin-top:22px;font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.3);text-transform:uppercase}
</style>
</head>

const PW_CACHE='lolw-pw';
const gate=document.getElementById('gate');
const gateForm=document.getElementById('gateForm');
const gatePw=document.getElementById('gatePw');
const gateErr=document.getElementById('gateErr');
const _te=new TextEncoder(), _td=new TextDecoder();
function _b64ToBuf(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function _bufToB64(buf){const u=new Uint8Array(buf);let s='';const CH=0x8000;for(let i=0;i<u.length;i+=CH){s+=String.fromCharCode.apply(null,u.subarray(i,Math.min(i+CH,u.length)));}return btoa(s);}
function _deriveKey(pw,salt){
  return crypto.subtle.importKey('raw',_te.encode(pw),'PBKDF2',false,['deriveKey'])
    .then(base=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']));
}
async function decryptDeck(pw){
  const key=await _deriveKey(pw,_b64ToBuf(ENC_SALT));
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:_b64ToBuf(ENC_IV)},key,_b64ToBuf(ENC_DATA));
  return _td.decode(plain);
}
async function encryptDeck(pw,text){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await _deriveKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,_te.encode(text));
  return {salt:_bufToB64(salt),iv:_bufToB64(iv),data:_bufToB64(ct)};
}
let deckInited=false;
async function unlockWith(pw){
  if(!pw) return false;
  let plain;
  try{ plain=await decryptDeck(pw); }
  catch(e){ return false; }
  document.querySelector('.deck').innerHTML=plain;
  sessionStorage.setItem(PW_CACHE,pw);
  if(!deckInited){ initDeck(); deckInited=true; }
  gate.classList.add('hidden');
  return true;
}
function lockGate(){ sessionStorage.removeItem(PW_CACHE); location.reload(); }
gateForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const ok=await unlockWith(gatePw.value.trim());
  if(ok){ gateErr.textContent=''; }
  else{ gateErr.textContent='비밀번호가 일치하지 않습니다. 다시 확인해주세요.'; gatePw.value=''; gatePw.focus(); }
});

/* ========== DECK INIT (runs after decryption injects the slides) ========== */
function initDeck(){
/* ========================================================================
   2026 LoL Worlds — CHZZK Live Package Sales Deck
   ======================================================================== */

/* ========== PRESENTATION MODE ========== */
const fsBtn=document.getElementById('fsBtn');
const presentCounter=document.getElementById('presentCounter');
let presentIdx=0;
function showPresentSlide(i){
  const all=document.querySelectorAll('.slide');
  presentIdx=Math.max(0,Math.min(all.length-1,i));
  all.forEach((s,k)=>s.classList.toggle('active',k===presentIdx));
  presentCounter.textContent=(presentIdx+1)+' / '+all.length;
}
function enterPresent(){
  document.body.classList.add('presenting');
  let inView=0;
  const vh=window.innerHeight;
  document.querySelectorAll('.slide').forEach((s,k)=>{
    const r=s.getBoundingClientRect();
    if(r.top<vh*.6 && r.bottom>vh*.4) inView=k;
  });
  showPresentSlide(inView);
  const fsEl=document.documentElement;
  try{
    if(fsEl.requestFullscreen) fsEl.requestFullscreen().catch(()=>{});
    else if(fsEl.webkitRequestFullscreen) fsEl.webkitRequestFullscreen();
  }catch(e){}
  fsBtn.querySelector('.lbl').textContent='종료 (ESC)';
}
function exitPresent(){
  document.body.classList.remove('presenting');
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  try{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
  fsBtn.querySelector('.lbl').textContent='프리젠테이션';
}
fsBtn.addEventListener('click',()=>{
  if(document.body.classList.contains('presenting')) exitPresent();
  else enterPresent();
});
document.getElementById('lockBtn').addEventListener('click',()=>{exitPresent();lockGate()});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  const fs=document.fullscreenElement||document.webkitFullscreenElement;
  if(!fs && document.body.classList.contains('presenting')) exitPresent();
}));
document.addEventListener('keydown',e=>{
  const ae=document.activeElement, tag=ae?ae.tagName:'';
  if(tag==='INPUT'||tag==='TEXTAREA'||(ae&&ae.isContentEditable)) return;
  if(e.key.toLowerCase()==='f' && !e.metaKey && !e.ctrlKey && !e.altKey){e.preventDefault();fsBtn.click();return}
  if(document.body.classList.contains('presenting')){
    if(e.key==='Escape'){e.preventDefault();exitPresent()}
    else if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'){e.preventDefault();showPresentSlide(presentIdx+1)}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();showPresentSlide(presentIdx-1)}
    else if(e.key==='Home'){e.preventDefault();showPresentSlide(0)}
    else if(e.key==='End'){e.preventDefault();showPresentSlide(999)}
  }
});

/* ========== HUD DOTS ========== */
(function(){
  const hud=document.getElementById('hud');
  const slides=[...document.querySelectorAll('.slide')];
  slides.forEach((s,i)=>{
    const a=document.createElement('a');
    a.href='#'+s.id; a.title='Slide '+(i+1);
    hud.appendChild(a);
  });
  const dots=[...hud.children];
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const i=slides.indexOf(e.target);
        dots.forEach(d=>d.classList.remove('on'));
        if(dots[i]) dots[i].classList.add('on');
      }
    });
  },{threshold:.55});
  slides.forEach(s=>io.observe(s));
})();

/* ========== SCROLL-MODE KEYBOARD NAV ========== */
(function(){
  let cur=0;
  document.addEventListener('keydown',e=>{
    if(document.body.classList.contains('presenting')) return;
    if(document.body.classList.contains('editing')) return;
    const ae=document.activeElement, tag=ae?ae.tagName:'';
    if(tag==='INPUT'||tag==='TEXTAREA'||(ae&&ae.isContentEditable)) return;
    const slides=[...document.querySelectorAll('.slide')];
    if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' '){
      e.preventDefault();cur=Math.min(slides.length-1,cur+1);
      slides[cur].scrollIntoView({behavior:'smooth',block:'center'});
    }else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){
      e.preventDefault();cur=Math.max(0,cur-1);
      slides[cur].scrollIntoView({behavior:'smooth',block:'center'});
    }else if(e.key==='Home'){cur=0;slides[0].scrollIntoView({behavior:'smooth'});}
    else if(e.key==='End'){cur=slides.length-1;slides[cur].scrollIntoView({behavior:'smooth'});}
  });
})();

  /* ---- IndexedDB for replaced images ---- */
  function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  function idbSet(k,v){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
  function idbAll(){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readonly'); const st=tx.objectStore(IDB_STORE); const kq=st.getAllKeys(), vq=st.getAll(); tx.oncomplete=()=>res({keys:kq.result,vals:vq.result}); tx.onerror=()=>rej(tx.error); })); }
  function idbClear(){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }

  /* ---- editable image placeholders ---- */
  function applyImg(img,dataUrl){
    img.src=dataUrl;
    if(img.parentNode) img.parentNode.classList.add('has-img');
  }
  const fileInput=document.createElement('input');
  fileInput.type='file'; fileInput.accept='image/*'; fileInput.style.display='none';
  document.body.appendChild(fileInput);
  let pendingImg=null;
  let ieidCounter=0;
  const imgEls=[...deck.querySelectorAll('img.mock-img')];
  imgEls.forEach(img=>{
    img.dataset.ieid='i'+(ieidCounter++);
    const host=img.parentNode; if(!host) return;
    host.classList.add('img-editable');
    host.addEventListener('click',e=>{
      if(!editing) return;
      e.preventDefault(); e.stopPropagation();
      pendingImg=img; fileInput.value=''; fileInput.click();
    });
  });
  fileInput.addEventListener('change',()=>{
    const f=fileInput.files&&fileInput.files[0]; if(!f||!pendingImg) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const url=rd.result, img=pendingImg; pendingImg=null;
      applyImg(img,url);
      idbSet(img.dataset.ieid,url).catch(err=>alert('이미지 저장에 실패했습니다: '+err.message));
    };
    rd.readAsDataURL(f);
  });
  if(window.indexedDB){
    idbAll().then(({keys,vals})=>{ keys.forEach((k,i)=>{ const img=deck.querySelector('[data-ieid="'+k+'"]'); if(img) applyImg(img,vals[i]); }); }).catch(()=>{});
  }

  /* ---- edit toggle ---- */
  let editing=false;
  const editBtn=document.getElementById('editBtn');
  function setEditing(on){
    editing=on;
    document.body.classList.toggle('editing',on);
    editBtn.classList.toggle('on',on);
    editBtn.querySelector('.lbl').textContent = on ? '수정완료' : '수정';
    document.querySelectorAll('.deck [data-eid]').forEach(el=>{
      if(on) el.setAttribute('contenteditable','true');
      else el.removeAttribute('contenteditable');
    });
    if(on && annotating) setAnnotating(false);
  }
  function toggleEdit(){ if(!editEnabled) return; setEditing(!editing); }
  editBtn.addEventListener('click',toggleEdit);
  document.addEventListener('keydown',e=>{
    if(!editEnabled) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(document.body.classList.contains('presenting')) return;
    const t=document.activeElement;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
    if(e.key.toLowerCase()==='e'){ e.preventDefault(); toggleEdit(); }
  });
  new MutationObserver(()=>{ if(document.body.classList.contains('presenting') && editing) setEditing(false); })
    .observe(document.body,{attributes:true,attributeFilter:['class']});

  /* ---- reset ---- */
  document.getElementById('resetBtn').addEventListener('click',()=>{
    if(!confirm('수정한 모든 텍스트와 이미지를 지우고 원본으로 되돌릴까요?\n(이 브라우저에 저장된 편집 내용이 삭제됩니다)')) return;
    localStorage.removeItem(TEXT_KEY);
    const done=()=>location.reload();
    if(window.indexedDB) idbClear().then(done).catch(done); else done();
  });

  /* ---- 💾 배포용 저장: 현재 편집 내용을 재암호화해 배포 가능한 index.html로 다운로드 ---- */
  const exportBtn=document.getElementById('exportBtn');
  exportBtn.addEventListener('click',async()=>{
    const input=prompt('새 비밀번호(빈칸=기존 비밀번호 유지, 취소=중단)','');
    if(input===null) return;
    const pw=input.trim()||AUTO_PW;
    exportBtn.classList.add('busy');
    try{
      const clone=deck.cloneNode(true);
      clone.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
      const deckHtml=clone.innerHTML;
      const enc=await encryptDeck(pw,deckHtml);
      const res=await fetch(location.pathname+'?raw='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error('원본 파일을 불러오지 못했습니다 (HTTP '+res.status+')');
      let raw=await res.text();
      const encRe=/\/\*ENC-START\*\/[\s\S]*?\/\*ENC-END\*\//;
      if(!encRe.test(raw)) throw new Error('ENC-START 블록을 찾지 못했습니다.');
      raw=raw.replace(encRe,()=>`/*ENC-START*/const ENC_SALT="${enc.salt}",ENC_IV="${enc.iv}",ENC_DATA="${enc.data}";/*ENC-END*/`);
      const autoRe=/\/\*AUTO-UNLOCK-START\*\/[\s\S]*?\/\*AUTO-UNLOCK-END\*\//;
      if(!autoRe.test(raw)) throw new Error('AUTO-UNLOCK 블록을 찾지 못했습니다.');
      raw=raw.replace(autoRe,()=>`/*AUTO-UNLOCK-START*/const AUTO_PW='${pw}';(function(){ unlockWith(AUTO_PW); })();/*AUTO-UNLOCK-END*/`);
      const blob=new Blob([raw],{type:'text/html'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='index.html'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      alert('배포용 index.html을 다운로드했습니다.\n비밀번호: '+pw+'\n\n이 파일로 기존 index.html을 덮어써서 git commit/push 하면 배포됩니다.');
    }catch(err){
      alert('저장에 실패했습니다.\n'+(err&&err.message?err.message:err));
    }finally{
      exportBtn.classList.remove('busy');
    }
  });

  /* ---- 📌 수정요청(annotation) 모드 ---- */
  const annotBtn=document.getElementById('annotBtn');
  let annotating=false, annots=[];
  try{ annots=JSON.parse(localStorage.getItem(ANNOT_KEY)||'[]'); if(!Array.isArray(annots)) annots=[]; }catch(e){ annots=[]; }
  const annotSave=()=>{ try{ localStorage.setItem(ANNOT_KEY,JSON.stringify(annots)); }catch(e){} };
  const annotPanel=document.createElement('div');
  annotPanel.className='annot-panel';
  annotPanel.innerHTML='<b>수정요청</b> <span class="ap-cnt"></span><div class="ap-list"></div><div class="ap-btns"><button class="ap-copy" type="button">요청 복사</button><button class="ap-clear" type="button">비우기</button></div><div style="opacity:.55;margin-top:6px">장표의 아무 영역이나 클릭 → 메모 입력. 복사해서 붙여넣으면 그 위치를 정확히 고칠 수 있습니다.</div>';
  document.body.appendChild(annotPanel);
  function annotPath(el,root){
    const parts=[];
    while(el&&el!==root&&el.parentElement){
      const p=el.parentElement, tag=el.tagName.toLowerCase();
      const cls=(typeof el.className==='string'&&el.className.trim())?'.'+el.className.trim().split(/\s+/)[0]:'';
      const sibs=[...p.children].filter(c=>c.tagName===el.tagName);
      parts.unshift(sibs.length>1?tag+cls+':nth-of-type('+(sibs.indexOf(el)+1)+')':tag+cls);
      el=p;
    }
    return parts.join(' > ');
  }
  function annotRender(){
    document.querySelectorAll('.annot-pin').forEach(p=>p.remove());
    annots.forEach((a,i)=>{
      const slide=document.getElementById(a.slide); if(!slide) return;
      const pin=document.createElement('div'); pin.className='annot-pin'; pin.textContent=i+1;
      pin.style.left=a.x+'%'; pin.style.top=a.y+'%';
      slide.appendChild(pin);
    });
    annotPanel.querySelector('.ap-cnt').textContent=annots.length+'건';
    annotPanel.querySelector('.ap-list').innerHTML=annots.map((a,i)=>'<div class="ap-item"><b>'+(i+1)+'.</b> ['+a.slide+'] '+a.memo.replace(/</g,'&lt;').slice(0,48)+'</div>').join('')||'<div style="opacity:.5">아직 요청이 없습니다</div>';
  }
  function setAnnotating(on){
    annotating=on;
    document.body.classList.toggle('annotating',on);
    annotBtn.classList.toggle('on',on);
    annotBtn.querySelector('.lbl').textContent=on?'요청작성 종료':'수정요청';
    if(on&&editing) setEditing(false);
    annotRender();
  }
  annotBtn.addEventListener('click',()=>setAnnotating(!annotating));
  document.addEventListener('click',e=>{
    if(!annotating) return;
    const t=e.target;
    if(t.closest('.toolbar')||t.closest('.annot-panel')||t.closest('.hud')) return;
    const slide=t.closest('.slide'); if(!slide||!slide.id) return;
    e.preventDefault(); e.stopPropagation();
    const cur=(t.textContent||'').trim().replace(/\s+/g,' ').slice(0,60);
    const memo=prompt('이 영역 수정요청 메모:'+(cur?'\n(선택: “'+cur+'”)':''));
    if(!memo||!memo.trim()) return;
    const sr=slide.getBoundingClientRect(), r=t.getBoundingClientRect();
    annots.push({slide:slide.id, path:annotPath(t,slide), eid:t.getAttribute('data-eid')||null,
      text:(t.textContent||'').trim().replace(/\s+/g,' ').slice(0,80), memo:memo.trim(),
      x:+(((r.left+r.width/2-sr.left)/sr.width*100).toFixed(2)),
      y:+(((r.top+r.height/2-sr.top)/sr.height*100).toFixed(2))});
    annotSave(); annotRender();
  },true);
  annotPanel.querySelector('.ap-copy').addEventListener('click',()=>{
    if(!annots.length){ alert('복사할 요청이 없습니다.'); return; }
    const txt='[LoL 월드챔피언십 덱 수정요청 '+annots.length+'건]\n'+annots.map((a,i)=>
      (i+1)+'. 슬라이드 #'+a.slide+' · 요소: '+a.path+(a.eid?' (eid:'+a.eid+')':'')+(a.text?' · 현재 텍스트: “'+a.text+'”':'')+'\n   → 요청: '+a.memo).join('\n');
    const done=()=>{ alert('복사 완료! 그대로 붙여넣으면 됩니다.'); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>{ window.prompt('아래 내용을 직접 복사하세요:',txt); });
    else window.prompt('아래 내용을 직접 복사하세요:',txt);
  });
  annotPanel.querySelector('.ap-clear').addEventListener('click',()=>{
    if(!annots.length) return;
    if(!confirm('수정요청 '+annots.length+'건을 모두 지울까요?')) return;
    annots=[]; annotSave(); annotRender();
  });
  annotRender();

  /* ========== ONE-CLICK PDF DOWNLOAD ========== */
  const pdfBtn=document.getElementById('pdfBtn');
  function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load fail: '+src)); document.head.appendChild(s); setTimeout(()=>rej(new Error('timeout: '+src)),12000); }); }
  async function loadFirst(urls, check){
    let last=null;
    for(const u of urls){ try{ await loadScript(u); if(!check||check()) return; last=new Error('로드됐으나 초기화 실패: '+u); }catch(e){ last=e; } }
    throw last||new Error('라이브러리 로드 실패');
  }
  let libsReady=false;
  async function ensureLibs(){
    if(libsReady) return;
    await loadFirst([
      'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
      'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'
    ], ()=>typeof window.html2canvas==='function');
    await loadFirst([
      'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
      'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
    ], ()=>window.jspdf&&typeof window.jspdf.jsPDF==='function');
    libsReady=true;
  }
  pdfBtn.addEventListener('click',async()=>{
    if(editing) setEditing(false);
    if(annotating) setAnnotating(false);
    if(document.body.classList.contains('presenting')) exitPresent();
    const orig=pdfBtn.querySelector('.lbl').textContent; pdfBtn.disabled=true;
    try{
      pdfBtn.querySelector('.lbl').textContent='PDF 준비 중…';
      await ensureLibs();
      const jsPDF=window.jspdf.jsPDF;
      const all=[...document.querySelectorAll('.slide')];
      let pdf=null;
      for(let i=0;i<all.length;i++){
        pdfBtn.querySelector('.lbl').textContent='PDF 생성 중 '+(i+1)+'/'+all.length+'…';
        const canvas=await html2canvas(all[i],{
          scale:2, useCORS:true, backgroundColor:null, logging:false,
          width:1600, height:900, windowWidth:1600,
          /* 로드 실패(0×0) 이미지는 건너뜀 → html2canvas createPattern 크래시 방지 */
          ignoreElements:(el)=> el.tagName==='IMG' && (el.naturalWidth===0 || el.naturalHeight===0),
          onclone:(doc)=>{
            doc.querySelectorAll('.slide').forEach(s=>{ s.style.borderRadius='0'; s.style.boxShadow='none'; });
            doc.querySelectorAll('.annot-pin').forEach(e=>e.remove());
            /* html2canvas는 background-clip:text 그라데이션 텍스트를 렌더하지 못함 → 단색 강제 */
            const solidFill=(sel,color)=>doc.querySelectorAll(sel).forEach(e=>{
              e.style.setProperty('background','none','important');
              e.style.setProperty('background-image','none','important');
              e.style.setProperty('-webkit-background-clip','border-box','important');
              e.style.setProperty('background-clip','border-box','important');
              e.style.setProperty('-webkit-text-fill-color',color,'important');
              e.style.setProperty('color',color,'important');
            });
            solidFill('.s1 h1 em, .s7 h1 em', '#6AE1F6');
          }
        });
        const data=canvas.toDataURL('image/jpeg',0.92);
        const w=canvas.width, h=canvas.height;
        if(i===0) pdf=new jsPDF({orientation:'landscape',unit:'px',format:[w,h]});
        else pdf.addPage([w,h],'landscape');
        pdf.addImage(data,'JPEG',0,0,w,h);
      }
      pdf.save('2026_LoL_Worlds_CHZZK_LivePackage.pdf');
    }catch(err){
      alert('PDF 자동 생성에 실패했습니다.\n('+(err&&err.message?err.message:err)+')\n\n사내망에서 외부 CDN(html2canvas/jsPDF)이 차단되면 발생할 수 있습니다.\n\n[가장 확실한 방법] 키보드 Cmd+P(Mac) / Ctrl+P(Windows) → 대상 "PDF로 저장" → 저장\n(레이아웃/색상 그대로 13장이 저장됩니다.)');
    }finally{
      pdfBtn.disabled=false; pdfBtn.querySelector('.lbl').textContent=orig;
    }
  });
})();
} // end initDeck

/* auto-unlock (no password prompt) — deck ciphertext still keeps plaintext out of the git source */
/*AUTO-UNLOCK-START*/const AUTO_PW='nlolworlds2026';(function(){ unlockWith(AUTO_PW); })();/*AUTO-UNLOCK-END*/
</script>
